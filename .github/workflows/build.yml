name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package zips (x64, arm64, ia32)
        run: npx electron-builder --win zip --x64 --arm64 --ia32 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dns-switcher-zips
          path: release/*.zip
